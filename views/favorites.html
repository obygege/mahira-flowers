<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Favorit - Mahira Flowers</title><meta name="robots" content="noindex, nofollow"><link rel="stylesheet" href="/css/customer.css">

<script src="/js/customer.js"></script><script>async function load(){if(!requireCustomer())return;try{const d=await customerFetch('/api/favorites?lang='+encodeURIComponent(customerLang()));document.getElementById('results').innerHTML=d.data?.map(p=>productCard(p,true)).join('')||`<div class="empty">${customerTranslations[customerLang()].fav_empty}</div>`}catch(e){document.getElementById('results').innerHTML=`<div class="empty">${safe(e.message)}</div>`}}document.addEventListener('mahira-lang-changed',load);load();</script></body></html>
