<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daftar - Mahira Flowers</title><link rel="stylesheet" href="/css/customer.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"></head><body><header class="customer-header"><a class="brand" href="/">Mahira Flowers</a><nav data-customer-account></nav></header><main class="page-shell"><section class="form-panel"><p class="eyebrow" data-i18n="reg_eyebrow">Mulai perjalanan Anda</p><h1 data-i18n="reg_title">Buat akun</h1><p class="muted" data-i18n="reg_desc">Gunakan akun Anda untuk menyimpan favorit dan keranjang.</p><form id="authForm"><div class="form-group"><label data-i18n="reg_name">Nama lengkap</label><input id="name" class="form-control" required></div><div class="form-group"><label data-i18n="reg_email">Email</label><input id="email" class="form-control" type="email" required></div><div class="form-group"><label data-i18n="reg_password">Password</label><input id="password" class="form-control" type="password" minlength="6" required></div><button class="btn btn-dark wide" data-i18n="reg_btn">Daftar</button><p id="message" class="message"></p></form><p class="auth-links"><span data-i18n="reg_have_account">Sudah punya akun?</span> <a href="/login" data-i18n="reg_login_link">Masuk</a></p></section></main><script src="/js/customer.js"></script><script>document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message');try{const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value.trim(),email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Pendaftaran gagal');localStorage.setItem('customer_token',d.token);localStorage.setItem('customer_user',JSON.stringify(d.user));await mergeGuestCartIntoServer();location.href=new URLSearchParams(location.search).get('next')||'/';}catch(err){m.textContent=err.message}})</script></body></html>
