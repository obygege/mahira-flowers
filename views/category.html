<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kategori - Mahira Flowers</title><meta name="description" content="Jelajahi koleksi bunga Mahira Flowers berdasarkan kategori pilihan.">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#8a1f2b">
<link rel="stylesheet" href="/css/customer.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/toast.css">
  <link rel="stylesheet" href="/css/chatbot.css"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="customer-header"><a class="brand" href="/">Mahira Flowers</a><nav data-customer-account><a href="/">Beranda</a><a href="/search">Cari</a></nav></header>
<main class="page-shell"><a class="back-link" href="/"><i class="fa-solid fa-arrow-left"></i> Kembali ke beranda</a><div class="page-heading"><div><p class="eyebrow" data-i18n="category_eyebrow">Koleksi Mahira</p><h1 id="title">Kategori</h1><p class="muted" data-i18n="category_desc">Produk pilihan berdasarkan kategori dari katalog kami.</p></div></div><div id="results" class="product-grid"></div></main>
<script src="/js/toast.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/customer.js"></script><script>async function load(){const slug=location.pathname.split('/').pop();try{const r=await fetch('/api/categories/'+encodeURIComponent(slug)+'?lang='+encodeURIComponent(customerLang()));const d=await r.json();if(!r.ok)throw Error(d.message);document.title=d.category.name+' - Mahira Flowers';document.getElementById('title').textContent=d.category.name;document.getElementById('results').innerHTML=d.data.map(p=>productCard(p)).join('')||`<div class="empty">${customerTranslations[customerLang()].category_empty}</div>`}catch(e){document.getElementById('results').innerHTML='<div class="empty">'+safe(e.message)+'</div>'}}document.addEventListener('mahira-lang-changed',load);load();</script>
</body></html>
