<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk - Mahira Flowers</title><meta name="robots" content="noindex, nofollow"><link rel="stylesheet" href="/css/customer.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png">
  <link rel="shortcut icon" href="/favicon.ico">
  <link rel="apple-touch-icon" sizes="180x180" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#8a1f2b"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/css/toast.css">
  <link rel="stylesheet" href="/css/chatbot.css"><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"></head><body><header class="customer-header"><a class="brand" href="/">Mahira Flowers</a><nav data-customer-account></nav></header><main class="page-shell"><section class="form-panel"><p class="eyebrow" data-i18n="login_eyebrow">Mahira Flowers</p><h1 data-i18n="login_title">Masuk ke akun</h1><p class="muted" data-i18n="login_desc">Simpan favorit dan kelola keranjang Anda.</p><form id="authForm"><div class="form-group"><label data-i18n="login_email">Email</label><input id="email" class="form-control" type="email" required></div><div class="form-group"><label data-i18n="login_password">Password</label><input id="password" class="form-control" type="password" required></div><button class="btn btn-dark wide" data-i18n="login_btn">Masuk</button><p id="message" class="message"></p></form><p class="auth-links"><span data-i18n="login_no_account">Belum punya akun?</span> <a href="/register" data-i18n="login_register_link">Daftar sekarang</a></p></section></main><script src="/js/toast.js"></script>
<script src="/js/chatbot.js"></script>
<script src="/js/customer.js"></script><script>document.getElementById('authForm').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message');m.textContent=customerTranslations[customerLang()].login_checking;try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value.trim(),password:password.value})});const d=await r.json();if(!r.ok||!d.success)throw Error(d.message||'Login gagal');localStorage.setItem('customer_token',d.token);localStorage.setItem('customer_user',JSON.stringify(d.user));await mergeGuestCartIntoServer();location.href=new URLSearchParams(location.search).get('next')||'/';}catch(err){m.textContent=err.message}})</script></body></html>
